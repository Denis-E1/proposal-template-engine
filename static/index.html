<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Proposal Template Engine</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #0b0f10;
      --panel: #11161a;
      --muted: #2a3338;
      --text: #e6fff2;
      --accent: #a6ff96;
      --accent2: #7cf2e6;
      --dim: #94a3b8;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 2rem;
      background: var(--bg); color: var(--text);
      font-family: var(--mono); line-height: 1.4;
    }
    .wrap { max-width: 1100px; margin: 0 auto; }
    h1 { font-weight: 700; margin: 0 0 1rem; color: var(--accent); }
    .grid { display: grid; gap: 14px; }
    .panel {
      background: var(--panel); border: 1px solid var(--muted);
      border-radius: 10px; padding: 14px;
    }
    label { display: block; font-size: 12px; color: var(--accent2); margin: 8px 0 6px; }
    input, select, textarea, button {
      width: 100%; background: #0f1418; color: var(--text);
      border: 1px solid var(--muted); border-radius: 8px; padding: 10px;
      font: 14px var(--mono);
    }
    textarea { min-height: 120px; resize: vertical; }
    .btn {
      background: #122015; border-color: #22422a; color: var(--accent);
      cursor: pointer; font-weight: 700;
    }
    .btn:hover { filter: brightness(1.08); }
    .cols-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td {
      border-bottom: 1px dashed var(--muted);
      padding: 8px 0; font-size: 14px;
    }
    .muted { color: var(--dim); font-size: 12px; }
    code, pre {
      background: #0f1418; border: 1px solid var(--muted);
      color: #b8ffbf; border-radius: 8px; padding: 10px; overflow: auto;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 900px) { .row, .cols-2 { grid-template-columns: 1fr; } }
    .right { text-align: right; }
    .actions { display:flex; gap:10px; }
  </style>
</head>
<body>
<div class="wrap grid">

  <h1>Proposal Template Engine</h1>

  <!-- Form panel -->
  <div class="panel grid">
    <div class="row">
      <div>
        <label>Client name</label>
        <input id="client" placeholder="Acme Labs" />
      </div>
      <div>
        <label>Currency</label>
        <select id="currency">
          <option value="USD">USD</option>
          <option value="KES">KES</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Hourly rate</label>
        <input id="hourly" type="number" step="0.01" value="35" />
      </div>
      <div>
        <label>Buffer % (0.2 = 20%)</label>
        <input id="bufferPct" type="number" step="0.01" value="0.20" />
      </div>
    </div>

    <div>
      <label>Brief</label>
      <textarea id="brief" placeholder="Paste your client brief here..."></textarea>
    </div>

    <div>
      <button id="go" class="btn">Generate Proposal</button>
    </div>
    <div class="muted">Tip: press <b>Ctrl</b> + <b>Enter</b> to submit.</div>
  </div>

  <!-- Totals + Deliverables -->
  <div class="row">
    <div class="panel">
      <h3>Totals</h3>
      <table class="table">
        <tbody id="totals">
          <tr><td>Subtotal hours</td><td class="right">0.00</td></tr>
          <tr><td>Rate</td><td class="right"><span id="rate">USD 0.00</span></td></tr>
          <tr><td>Subtotal</td><td class="right"><span id="subtotal">USD 0.00</span></td></tr>
          <tr><td>Buffer</td><td class="right"><span id="buffer">USD 0.00</span></td></tr>
          <tr><td><b>Total</b></td><td class="right"><b id="total">USD 0.00</b></td></tr>
        </tbody>
      </table>
      <div class="actions" style="margin-top:10px">
        <button class="btn" id="copyMd">Copy Markdown</button>
        <button class="btn" id="dlMd">Download .md</button>
      </div>
    </div>

    <div class="panel">
      <h3>Deliverables</h3>
      <div id="deliverables" class="muted">—</div>
    </div>
  </div>

  <!-- Milestones + Risks -->
  <div class="row">
    <div class="panel">
      <h3>Milestones</h3>
      <div id="milestones" class="muted">—</div>
    </div>
    <div class="panel">
      <h3>Risks</h3>
      <div id="risks" class="muted">—</div>
    </div>
  </div>

  <!-- Markdown -->
  <div class="panel">
    <h3>Summary (Markdown)</h3>
    <pre id="md">—</pre>
  </div>

  <!-- Raw JSON -->
  <div class="panel">
    <h3>Raw JSON</h3>
    <pre id="raw">—</pre>
  </div>

</div>

<script>
  const $ = (id) => document.getElementById(id);
  const fmt = (n, ccy) => `${ccy} ${Number(n || 0).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2})}`;

  async function generate() {
    const body = {
      client: $("client").value.trim(),
      currency: $("currency").value,
      hourly: $("hourly").value,
      bufferPct: $("bufferPct").value,
      brief: $("brief").value.trim(),
    };
    const res = await fetch("/proposals", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body),
    });

    if (!res.ok) {
      const t = await res.text();
      alert("Error: " + t);
      return;
    }
    const data = await res.json();

    // totals
    const t = data.totals || {};
    $("rate").textContent = fmt(t.rate, t.currency || "USD");
    $("subtotal").textContent = fmt(t.subtotal, t.currency || "USD");
    $("buffer").textContent = fmt(t.buffer, t.currency || "USD");
    $("total").textContent = fmt(t.total, t.currency || "USD");
    // first cell is hours (not currency)
    const rows = $("totals").querySelectorAll("tr");
    rows[0].querySelector(".right").textContent = (t.subtotal_hours || 0).toFixed(2);

    // deliverables
    const ds = data.scope?.deliverables || [];
    $("deliverables").innerHTML = ds.length
      ? "<ul>" + ds.map(d => `<li><b>${d.title || "-"}</b> — ${(d.est_hours||0).toFixed(1)} h<br/><span class="muted">${d.description||""}</span></li>`).join("") + "</ul>"
      : "—";

    // milestones
    const ms = data.scope?.milestones || [];
    $("milestones").innerHTML = ms.length
      ? "<ul>" + ms.map(m => `<li><b>${m.title || "-"}</b> — wk ${m.due_week||"-"}</li>`).join("") + "</ul>"
      : "—";

    // risks
    const rs = data.scope?.risks || [];
    $("risks").innerHTML = rs.length
      ? "<ul>" + rs.map(r => `<li><b>${r.title || "-"}</b>${r.severity ? " ("+r.severity+")":""}<br/><span class="muted">${r.mitigation||""}</span></li>`).join("") + "</ul>"
      : "—";

    // markdown + raw
    $("md").textContent = data.markdown || "";
    $("raw").textContent = JSON.stringify(data, null, 2);
  }

  $("go").addEventListener("click", generate);
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key === "Enter") generate();
  });

  $("copyMd").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText($("md").textContent);
      alert("Markdown copied!");
    } catch (e) { alert("Copy failed: " + e); }
  });

  $("dlMd").addEventListener("click", () => {
    const blob = new Blob([$("md").textContent], {type: "text/markdown"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = "proposal.md";
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
