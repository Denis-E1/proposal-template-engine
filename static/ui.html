<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Proposal Template Engine</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<style>
:root{--bg:#0b0f14;--card:#11161d;--text:#e7f5ff;--muted:#9cb3c9;--accent:#b6f28f;--line:#22303d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 ui-monospace,Menlo,Consolas,monospace}
h1{font-size:22px;margin:24px 0 12px}.wrap{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
input,select,textarea,button{width:100%;background:#0c1218;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:8px}
textarea{min-height:120px}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0;border-top:1px dashed var(--line);padding-top:6px}
.kv div:nth-child(odd){color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.btn{cursor:pointer;background:#14221a;border:1px solid #2e4;border-radius:8px;padding:10px}
pre{white-space:pre-wrap;background:#0c1218;border:1px solid var(--line);padding:10px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Proposal Template Engine</h1>
  <div class="card">
    <div class="row">
      <div><label>Client name</label><input id="client" value="Sarah"></div>
      <div><label>Currency</label><select id="currency"><option>USD</option><option>KES</option></select></div>
    </div>
    <div class="row">
      <div><label>Hourly rate</label><input id="rate" type="number" step="0.01" value="52"></div>
      <div><label>Buffer % (0.2 = 20%)</label><input id="buffer" type="number" step="0.01" value="0.2"></div>
    </div>
    <div><label>Brief</label><textarea id="brief">Hi! I'm Sarah from TechFlow Solutions. We're a growing B2B software company…</textarea></div>
    <div><button class="btn" id="go">Generate Proposal</button></div>
    <div class="small">Tip: press <b>Ctrl + Enter</b> to submit.</div>
  </div>

  <div class="row">
    <div class="card">
      <h3>Totals</h3>
      <div id="totals" class="kv small"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn" id="copyMd">Copy Markdown</button>
        <button class="btn" id="dlMd">Download .md</button>
      </div>
    </div>
    <div class="card">
      <h3>Deliverables</h3>
      <div id="deliverables" class="small">—</div>
    </div>
  </div>

  <div class="row">
    <div class="card"><h3>Milestones</h3><div id="milestones" class="small">—</div></div>
    <div class="card"><h3>Risks</h3><div id="risks" class="small">—</div></div>
  </div>

  <div class="card"><h3>Summary (Markdown)</h3><pre id="md" class="small"></pre></div>
  <div class="card"><h3>Raw JSON</h3><pre id="raw" class="small"></pre></div>
</div>
<script>
const $=id=>document.getElementById(id);
function renderKV(el,t){el.innerHTML=`
  <div>Subtotal hours</div><div>${t.subtotal_hours.toFixed(2)}</div>
  <div>Rate</div><div>${t.currency} ${Number(t.rate).toFixed(2)}</div>
  <div>Subtotal</div><div>${t.fmt.subtotal}</div>
  <div>Buffer</div><div>${t.fmt.buffer}</div>
  <div>Total</div><div><b>${t.fmt.total}</b></div>`}
function renderList(el,arr,fn){el.innerHTML=!arr||!arr.length?'—':arr.map(fn).join('')}
function copy(s){navigator.clipboard.writeText(s)}
async function submit(){
  const payload={client:$('client').value,currency:$('currency').value,hourly_rate:$('rate').value,buffer:$('buffer').value,brief:$('brief').value};
  const r=await fetch('/proposals',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});
  if(!r.ok){alert('Error: '+r.statusText);return}
  const d=await r.json();
  renderKV($('totals'),d.totals);
  renderList($('deliverables'),d.scope.deliverables,(x)=>`<div class="kv"><div>${x.title}</div><div>${Number(x.est_hours).toFixed(1)} h</div></div><div class="small" style="margin-bottom:8px">${x.description||''}</div>`);
  renderList($('milestones'),d.scope.milestones,(m)=>`<div class="kv"><div>${m.title}</div><div>wk ${m.due_week}</div></div>`);
  renderList($('risks'),d.scope.risks,(r)=>`<div class="kv"><div>${r.title}</div><div>${r.severity}</div></div><div class="small" style="margin-bottom:8px">${r.mitigation||''}</div>`);
  $('md').textContent=d.markdown||''; $('raw').textContent=JSON.stringify(d,null,2);
  $('copyMd').onclick=()=>copy(d.markdown||''); $('dlMd').onclick=()=>{const a=document.createElement('a');a.href='data:text/markdown;charset=utf-8,'+encodeURIComponent(d.markdown||'');a.download='proposal.md';a.click();}
}
$('go').onclick=submit; document.addEventListener('keydown',(e)=>{if(e.ctrlKey&&e.key==='Enter')submit();});
</script>
</body>
</html>
