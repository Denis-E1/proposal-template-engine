<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Proposal Template Engine</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    body { background:#0b0f14; color:#c8f7c5; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; margin:20px; }
    h1 { color:#90ee90; }
    input, textarea, select, button { background:#11161d; color:#c8f7c5; border:1px solid #2a3b4c; padding:8px; border-radius:6px; width:100%; }
    label { display:block; margin:10px 0 4px; }
    .row { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    .card { border:1px solid #2a3b4c; padding:16px; border-radius:10px; margin:12px 0; }
    .btn { cursor:pointer; font-weight:600; }
    pre { background:#0e141a; padding:12px; border-radius:10px; overflow:auto; }
  </style>
</head>
<body>
  <h1>Proposal Template Engine</h1>

  <div class="card">
    <div class="row">
      <div>
        <label>Client name</label>
        <input id="client" placeholder="Acme Co."/>
      </div>
      <div>
        <label>Currency</label>
        <select id="currency">
          <option value="USD">USD</option>
          <option value="KES">KES</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Hourly rate</label>
        <input id="rate" type="number" value="35"/>
      </div>
      <div>
        <label>Buffer % (0.2 = 20%)</label>
        <input id="buffer" type="number" step="0.05" value="0.20"/>
      </div>
    </div>
    <label>Brief</label>
    <textarea id="brief" rows="8" placeholder="Paste the client brief here..."></textarea>
    <button class="btn" onclick="gen()">Generate Proposal</button>
  </div>

  <div id="out" class="card" style="display:none">
    <h3>Result (JSON)</h3>
    <pre id="json"></pre>
    <h3>Summary (Markdown)</h3>
    <pre id="md"></pre>
  </div>

<script>
async function gen() {
  const payload = {
    client_name: document.getElementById('client').value.trim(),
    currency: document.getElementById('currency').value,
    hourly_rate: parseFloat(document.getElementById('rate').value),
    buffer_pct: parseFloat(document.getElementById('buffer').value),
    brief: document.getElementById('brief').value.trim()
  };
  const res = await fetch('/proposals', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
  const data = await res.json();
  document.getElementById('out').style.display = 'block';
  document.getElementById('json').textContent = JSON.stringify(data, null, 2);
  document.getElementById('md').textContent = data.summary_md || '';
}
</script>
</body>
</html>
